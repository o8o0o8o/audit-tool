name: SEO audit

run-name: "Audit ${{ inputs.url }} (${{ inputs.run_id }})"

on:
  workflow_dispatch:
    inputs:
      url:
        description: Website URL to audit
        required: true
        type: string
      run_id:
        description: Run id generated by the web dispatcher (^[a-z0-9][a-z0-9-]{7,63}$)
        required: true
        type: string
      perf:
        description: Performance metrics (--perf)
        type: string
        default: 'false'
      llm:
        description: LLM passes (--llm)
        type: string
        default: 'false'
      verify:
        description: Live verification (--verify)
        type: string
        default: 'false'
      content_research:
        description: Competitive content research (--content-research)
        type: string
        default: 'false'
      concurrency:
        description: Parallel pages (1-20)
        type: string
        default: '5'
      limit:
        description: Max pages to audit (empty = all)
        type: string
        default: ''
      evidence_cap:
        description: Evidence sample cap (1-100)
        type: string
        default: '10'
      preset:
        description: Audit preset (sales, marketing, seo, custom; empty = full audit)
        type: string
        default: ''
      sections:
        description: Report sections for the custom preset (comma-separated)
        type: string
        default: ''

permissions:
  contents: read

jobs:
  audit:
    # Pinned: ubuntu-latest (26.04) is not supported by Playwright 1.50.
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    env:
      RUN_ID: ${{ inputs.run_id }}
      AUDIT_URL: ${{ inputs.url }}
      IN_PERF: ${{ inputs.perf }}
      IN_LLM: ${{ inputs.llm }}
      IN_VERIFY: ${{ inputs.verify }}
      IN_CONTENT_RESEARCH: ${{ inputs.content_research }}
      IN_CONCURRENCY: ${{ inputs.concurrency }}
      IN_LIMIT: ${{ inputs.limit }}
      IN_EVIDENCE_CAP: ${{ inputs.evidence_cap }}
      IN_PRESET: ${{ inputs.preset }}
      IN_SECTIONS: ${{ inputs.sections }}
      # Either a legacy Blob read-write token, or Vercel credentials to pull OIDC Blob access
      # (see web/scripts/vercel-blob-env.sh).
      BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Validate inputs
        run: |
          if ! printf '%s' "$RUN_ID" | grep -Eq '^[a-z0-9][a-z0-9-]{7,63}$'; then
            echo "::error::invalid run_id"; exit 1
          fi
          case "$AUDIT_URL" in http://*|https://*) ;; *) echo "::error::url must be http(s)"; exit 1 ;; esac
          for n in "$IN_CONCURRENCY" "$IN_LIMIT" "$IN_EVIDENCE_CAP"; do
            if [ -n "$n" ] && ! printf '%s' "$n" | grep -Eq '^[0-9]+$'; then
              echo "::error::numeric inputs must be integers"; exit 1
            fi
          done
          case "$IN_PRESET" in ''|sales|marketing|seo|custom) ;; *) echo "::error::invalid preset"; exit 1 ;; esac
          if [ -n "$IN_SECTIONS" ] && ! printf '%s' "$IN_SECTIONS" | grep -Eq '^[a-z-]+(,[a-z-]+)*$'; then
            echo "::error::invalid sections"; exit 1
          fi
          echo "AUDIT_STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
          echo "AUDIT_OPTIONS=$(jq -cn --arg perf "$IN_PERF" --arg llm "$IN_LLM" --arg verify "$IN_VERIFY" \
            --arg contentResearch "$IN_CONTENT_RESEARCH" --arg concurrency "$IN_CONCURRENCY" \
            --arg limit "$IN_LIMIT" --arg evidenceCap "$IN_EVIDENCE_CAP" \
            --arg preset "$IN_PRESET" --arg sections "$IN_SECTIONS" '$ARGS.named')" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: |
            yarn.lock
            web/yarn.lock

      # First, so the always() status upload works even if the audit's own install fails.
      - name: Install upload dependencies
        run: yarn --cwd web install --frozen-lockfile

      - name: Install dependencies
        run: |
          yarn install --frozen-lockfile
          npx playwright install --with-deps chromium

      - name: Report running
        run: |
          source web/scripts/vercel-blob-env.sh
          node web/scripts/upload-results.mjs --status=running

      - name: Run audit
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CRUX_API_KEY: ${{ secrets.CRUX_API_KEY }}
        # Mirrors toCliArgs() in web/lib/audit-options.ts.
        run: |
          args=("--origin=$AUDIT_URL")
          [ -n "$IN_PRESET" ] && args+=("--preset=$IN_PRESET")
          [ -n "$IN_SECTIONS" ] && args+=("--sections=$IN_SECTIONS")
          [ "$IN_PERF" = "true" ] && args+=("--perf")
          [ "$IN_LLM" = "true" ] && args+=("--llm")
          [ "$IN_VERIFY" = "true" ] && args+=("--verify")
          [ "$IN_CONTENT_RESEARCH" = "true" ] && args+=("--content-research")
          [ -n "$IN_CONCURRENCY" ] && args+=("--concurrency=$IN_CONCURRENCY")
          [ -n "$IN_LIMIT" ] && args+=("--limit=$IN_LIMIT")
          [ -n "$IN_EVIDENCE_CAP" ] && args+=("--evidence-cap=$IN_EVIDENCE_CAP")
          npx tsx start.ts "${args[@]}"

      - name: Upload results to Blob
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          case "$JOB_STATUS" in
            success) status=succeeded ;;
            cancelled) status=cancelled ;;
            *) status=failed ;;
          esac
          source web/scripts/vercel-blob-env.sh
          node web/scripts/upload-results.mjs --status="$status"

      - name: Upload results artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-${{ inputs.run_id }}
          path: audit-results/
          if-no-files-found: ignore
          retention-days: 14
