name: Platform cron

# Runs one of the audit platform's two timers by hand:
#   tick       reaper, dispatch, PDF jobs, loader, re-score, webhooks
#   retention  expired files, finished audits' snapshots
# The schedule itself is on Vercel (`web/vercel.json`). It was here first, but GitHub never started
# a scheduled run of this workflow (2026-11-23: none in the first 7 hours on main).
#
# Repository variable PLATFORM_CRON_URL: the app's address (no trailing slash). Not set: nothing runs.
# Repository secret PLATFORM_CRON_SECRET: the app's CRON_SECRET.
on:
  workflow_dispatch:
    inputs:
      step:
        description: tick or retention
        type: choice
        options: [tick, retention]
        default: tick

permissions: {}

concurrency:
  group: platform-cron-${{ inputs.step || 'tick' }}
  cancel-in-progress: false

jobs:
  call:
    if: vars.PLATFORM_CRON_URL != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      APP_URL: ${{ vars.PLATFORM_CRON_URL }}
      CRON_SECRET: ${{ secrets.PLATFORM_CRON_SECRET }}
      STEP: ${{ inputs.step || 'tick' }}
    steps:
      - name: Call the app
        run: |
          case "$APP_URL" in https://*) ;; *) echo "::error::PLATFORM_CRON_URL must be an https address"; exit 1 ;; esac
          if [ -z "$CRON_SECRET" ]; then echo "::error::PLATFORM_CRON_SECRET is not set"; exit 1; fi
          # Only the status is printed: this log is readable by anyone who can see the repository.
          code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 330 \
            -H "Authorization: Bearer $CRON_SECRET" "$APP_URL/api/cron/$STEP") || code=000
          echo "$STEP: HTTP $code"
          [ "$code" = "200" ]
